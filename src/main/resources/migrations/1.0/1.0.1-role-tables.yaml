databaseChangeLog:
  - changeSet:
      id: role-tables
      author: hamidsultanzadeh
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: owner_id
            baseTableName: roles
            constraintName: fk_roles_owner_id
            deferrable: false
            initiallyDeferred: false
            onDelete: NO ACTION
            onUpdate: NO ACTION
            referencedColumnNames: id
            referencedTableName: users
            validate: true

        - createTable:
            tableName: role_objects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false

        - createTable:
            tableName: role_accesses
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  autoIncrement: true
              - column:
                  name: role_object_id
                  type: BIGINT
                  autoIncrement: true
              - column:
                  name: read
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: create
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: edit
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: delete
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: role_id
            baseTableName: role_accesses
            constraintName: fk_role_accesses_role_id
            deferrable: false
            initiallyDeferred: false
            onDelete: NO ACTION
            onUpdate: NO ACTION
            referencedColumnNames: id
            referencedTableName: roles
            validate: true

        - addForeignKeyConstraint:
            baseColumnNames: role_object_id
            baseTableName: role_accesses
            constraintName: fk_role_accesses_role_object_id
            deferrable: false
            initiallyDeferred: false
            onDelete: NO ACTION
            onUpdate: NO ACTION
            referencedColumnNames: id
            referencedTableName: role_objects
            validate: true

  - changeSet:
      id: user-role-foreign-key
      author: hamidsultanzadeh
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: role_id
            baseTableName: users
            constraintName: fk_users_role_id
            deferrable: false
            initiallyDeferred: false
            onDelete: NO ACTION
            onUpdate: NO ACTION
            referencedColumnNames: id
            referencedTableName: roles
            validate: true